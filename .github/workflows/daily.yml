name: Daily AI tools digest

on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 Beijing time, daily
  workflow_dispatch:      # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collect.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily README.md seen.json
          git diff --staged --quiet || git commit -m "chore: daily AI tools digest for $(date -u +%Y-%m-%d)"
          git push
